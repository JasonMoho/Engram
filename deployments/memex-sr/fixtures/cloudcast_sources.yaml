version: 1
deployment: memex-sr
source_pack: cloudcast-actionable-v0
review_state: reviewed_seed_v0

description: >-
  Reviewed seed manifest for making the Cloudcast Memex-SR slice
  actionable. This is an acquisition and extraction target list, not a
  permission grant. The acquisition planner decides whether each source
  is open, local, MIT-manual, metadata-only, or blocked.

default_topic_slugs:
  - cloudcast
  - multicast
  - routing
  - traffic-engineering
  - cost-aware-routing
  - steiner-tree
  - wide-area-transfer

extraction_target_vocabulary:
