source_note: >
  First-pass operator-curated facts from the fair Cloudcast task prompt,
  non-oracle evaluator behavior, and local Codex smoke runs. This pack
  intentionally excludes optimal.py and task_prompt_direction_with_optimal.txt.

evidence:
  - id: benchmark-objective
    kind: benchmark_contract
    strength: high
    statement: >
      Cloudcast asks the agent to minimize total transfer cost while
      respecting throughput constraints and provider ingress/egress limits
      across a directed multi-cloud graph.
    source_path: SystemBench/ADRS/cloudcast/deepagents_files/task_prompt_direction.txt
    rationale: >
      The fair prompt states the objective, graph structure, partitioning
      model, provider limits, and cost/time calculation used by the
      evaluator.

  - id: shared-tree-smoke-result
    kind: benchmark_result
    strength: high
    statement: >
      A directed-Steiner-style shared-tree candidate scored 0.001601037995
      with inferred total cost 623.594796 and 5/5 successful configs in
      the Codex+OKG-MCP smoke run.
    source_path: deployments/memex-sr/reports/cloudcast-ab/codex-vs-codex-okg-mcp.md
    rationale: >
      The run used the fair benchmark workspace, excluded oracle files, and
      produced valid paths for all evaluated configurations.

  - id: baseline-smoke-result
    kind: benchmark_result
    strength: moderate
    statement: >
      The no-OKG Codex smoke baseline scored 0.001602764006 with inferred
      total cost 622.922172 and 5/5 successful configs.
    source_path: deployments/memex-sr/reports/cloudcast-ab/codex-vs-codex-okg-mcp.md
    rationale: >
      This gives a local comparison point for evaluating whether graph
      context changes search behavior.

  - id: evaluator-shared-edge-charge
    kind: evaluator_semantics
    strength: high
    statement: >
      The evaluator rewards multicast sharing because shared edges are
      charged by partition traffic through the edge, not independently
      for every destination that uses the same edge.
    source_path: SystemBench/ADRS/cloudcast/simulator.py
    rationale: >
      Local benchmark inspection and smoke-run summaries indicate that
      minimizing the union of partition edge traffic dominates independent
      per-destination shortest paths.

  - id: context-packet-gap
    kind: graph_gap
    strength: high
    statement: >
      The first generated Cloudcast context packet had zero design
      principle, mechanism, trade-off, anti-pattern, and evidence rows.
    source_path: deployments/memex-sr/reports/cloudcast-ab/context-packet.md
    rationale: >
      The graph had paper metadata and planning documents, but no typed
      Cloudcast design-knowledge facts before this seed pack.

design_principles:
  - id: optimize-shared-structure-first
    statement: >
      Optimize the shared multicast structure before tuning individual
      source-to-destination paths.
    why_it_matters: >
      Cloudcast cost is driven by the union of partition traffic through
      edges. Independent shortest paths miss sharing opportunities and can
      pay the same expensive egress repeatedly.
    strength: high
    evidence_ids:
      - generic_evidence:cloudcast:benchmark-objective
      - generic_evidence:cloudcast:evaluator-shared-edge-charge

  - id: model-capacity-before-price
    statement: >
      Model bottleneck capacity and provider limits before treating edge
      price as the only routing objective.
    why_it_matters: >
      A cheaper edge can still be unusable or slow when throughput,
      ingress, egress, or VM-region limits become binding.
    strength: high
    evidence_ids:
      - generic_evidence:cloudcast:benchmark-objective

  - id: separate-topology-from-partition-assignment
    statement: >
      Separate topology selection from partition assignment when the full
      integer problem is too large.
    why_it_matters: >
      Selecting a low-cost multicast tree and then deciding whether
      partitions should share or diversify paths is easier to reason about
      than solving all destination and partition choices at once.
    strength: moderate
    evidence_ids:
      - generic_evidence:cloudcast:shared-tree-smoke-result

  - id: keep-fair-benchmark-boundary
    statement: >
      Keep benchmark evidence separate from oracle artifacts.
    why_it_matters: >
      Cloudcast contains oracle files that can invalidate comparisons.
      Agents should use fair prompts, evaluator behavior, and public
      systems knowledge rather than hidden optimal solutions.
    strength: high
    evidence_ids:
      - generic_evidence:cloudcast:benchmark-objective

mechanisms:
  - id: directed-steiner-dp
    name: Directed Steiner dynamic program over terminal subsets
    mechanism_kind: algorithm
    applicability: >
      Useful when the destination set is small enough to enumerate
      terminal subsets and the objective favors a shared directed tree.
    known_limits: >
      Runtime grows exponentially in destination count and it does not by
      itself solve partition-level load spreading.
    strength: high
    evidence_ids:
      - generic_evidence:cloudcast:shared-tree-smoke-result
    instantiates:
      - optimize-shared-structure-first

  - id: min-cost-flow-or-milp
    name: Min-cost flow or MILP formulation
    mechanism_kind: algorithm
    applicability: >
      Useful for explicitly representing edge usage, capacity limits,
      egress price, and partition assignment when solve time is acceptable.
    known_limits: >
      Full formulations can be slow or brittle under benchmark time
      budgets, so relaxations or decomposition may be needed.
    strength: moderate
    evidence_ids:
      - generic_evidence:cloudcast:benchmark-objective
    instantiates:
      - model-capacity-before-price
      - separate-topology-from-partition-assignment

  - id: equal-cost-tree-diversification
    name: Equal-cost tree diversification for partitions
    mechanism_kind: algorithm
    applicability: >
      Useful after a low-cost shared tree is found, especially when a
      small set of alternate edges can reduce bottleneck time without
      materially increasing egress cost.
    known_limits: >
      Blind diversification can add instance or edge costs and erase the
      savings from multicast sharing.
    strength: moderate
    evidence_ids:
      - generic_evidence:cloudcast:shared-tree-smoke-result
    instantiates:
      - separate-topology-from-partition-assignment

  - id: provider-limit-cost-estimator
    name: Provider-limit-aware cost estimator
    mechanism_kind: design_pattern
    applicability: >
      Useful as an internal scoring function for candidate routes before
      spending official evaluator calls.
    known_limits: >
      Must match simulator semantics closely; a partial estimator can
      overfit edge price while missing bottleneck or VM-region effects.
    strength: high
    evidence_ids:
      - generic_evidence:cloudcast:benchmark-objective
    instantiates:
      - model-capacity-before-price

trade_offs:
  - id: shared-tree-vs-path-diversity
    objective_a: shared multicast tree reuse
    objective_b: path diversity for bottleneck relief
    tension: >
      Reusing one tree minimizes egress cost, but sending all partitions
      through the same bottleneck can increase completion time.
    failure_modes: >
      Too little diversity leaves transfer time high; too much diversity
      increases edge and instance costs enough to lose the main benefit.
    strength: high
    evidence_ids:
      - generic_evidence:cloudcast:shared-tree-smoke-result
    restricts:
      - directed-steiner-dp
      - equal-cost-tree-diversification

  - id: exact-quality-vs-solve-time
    objective_a: exact optimization quality
    objective_b: benchmark solve time
    tension: >
      Exact DP or MILP can find better structures, but high solve time
      reduces robustness under the benchmark's agent loop.
    failure_modes: >
      A solver-heavy approach may time out, burn evaluation budget, or
      become too complex to repair after one failed run.
    strength: moderate
    evidence_ids:
      - generic_evidence:cloudcast:shared-tree-smoke-result
    restricts:
      - directed-steiner-dp
      - min-cost-flow-or-milp

  - id: egress-price-vs-capacity
    objective_a: low egress price
    objective_b: sufficient throughput and provider capacity
    tension: >
      Cheapest edges are not always best when they create bottlenecks or
      violate provider ingress and egress limits.
    failure_modes: >
      Cost-only routing can look cheap in a static path search but fail
      or score poorly once throughput and VM capacity are evaluated.
    strength: high
    evidence_ids:
      - generic_evidence:cloudcast:benchmark-objective
    restricts:
      - provider-limit-cost-estimator

anti_patterns:
  - id: independent-dijkstra-per-destination
    approach: >
      Route each destination independently with shortest path or
      cheapest path.
    why_it_tends_to_fail: >
      It ignores multicast sharing, so the same source egress or relay
      opportunity can be paid repeatedly across destinations.
    strength: high
    evidence_ids:
      - generic_evidence:cloudcast:evaluator-shared-edge-charge
    mitigated_by:
      - directed-steiner-dp

  - id: edge-price-only-objective
    approach: >
      Optimize only per-edge price without modeling throughput,
      bottleneck time, provider ingress, or provider egress.
    why_it_tends_to_fail: >
      The evaluator combines cost and transfer-time behavior; invalid or
      slow routes lose even when the nominal edge price is low.
    strength: high
    evidence_ids:
      - generic_evidence:cloudcast:benchmark-objective
    mitigated_by:
      - provider-limit-cost-estimator

  - id: blind-partition-diversification
    approach: >
      Diversify partitions across alternate paths without a cost and
      capacity estimator.
    why_it_tends_to_fail: >
      Added path diversity can increase edge and instance cost more than
      it reduces transfer time.
    strength: moderate
    evidence_ids:
      - generic_evidence:cloudcast:shared-tree-smoke-result
    mitigated_by:
      - equal-cost-tree-diversification

  - id: oracle-contaminated-context
    approach: >
      Use optimal.py or task_prompt_direction_with_optimal.txt as
      context for a fair benchmark comparison.
    why_it_tends_to_fail: >
      It leaks the holdout solution and makes any reported improvement
      uninterpretable.
    strength: high
    evidence_ids:
      - generic_evidence:cloudcast:benchmark-objective
    mitigated_by:
      - provider-limit-cost-estimator
