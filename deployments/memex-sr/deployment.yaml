name: memex-sr
description: Engram-owned Memex-SR OKG deployment for autonomous systems research.

postgres:
  dsn: ${OKG_DSN}

runtime:
  enabled: false

schema_dir: schemas
source_registry: source_registry.yaml
mcp_instructions: docs/mcp-instructions.md

modules:
  - git_graph
  - extraction
  # Latest OKG dev's extraction module includes claim/evidence routes.
  # Reasoning supplies Evidence/Hypothesis; openspec and agent_memory
  # satisfy reasoning's own optional cross-module narrowings.
  - reasoning
  - openspec
  - agent_memory
  - person

embedding:
  enabled: false
  reason: Memex-SR currently uses deterministic lexical search and graph traversal.

modules_config:
  git_graph:
    repo: engram
    repo_root: ${repo_root}
    include_untracked: true
    include_history: false

  extraction:
    repo: engram
    repo_root: ${repo_root}
    extractors_dir: ${manifest_dir}
