sources:
  paper_cut:
    module: sources.paper_cut
    class: PaperCutSource
    ownership_id: memex-sr.paper-cut
    source_class: reference_catalog
    record_identity_kind: domain_key
    record_identity_fields: [manifest_path]
    source_revision_kind: content_hash
    deletion_semantics: missing_from_completed_scope
    publication_mode: published_generation
    params:
      manifest_path: ${repo_root}/deployments/memex-sr/manifests/paper_cut.json
    sync:
      watch:
        roots:
          - ${repo_root}/deployments/memex-sr/manifests
        include_globs:
          - deployments/memex-sr/manifests/paper_cut.json
      triggers: [manual, reconcile]
      default_event_mode: scope_complete
      reconcile_mode: scope_complete
      deletes_require_reconcile: true
      cheap_probe: stat_tree
      scope:
        accepts: [path]
        unsupported_fallback: scope_complete
      dependents:
        on_event: none
        on_reconcile: none
      poll:
        probe: stat_tree
        interval_seconds: 3600

  openalex:
    ownership_id: memex-sr.openalex
    source_class: registry_only
    params:
      venues_file: ${repo_root}/deployments/memex-sr/venues.yaml
      mode: manifest-builder-only
    note: >
      OpenAlex is used by the offline paper-cut builder, not by publish.
      Keeping this registry-only avoids live network calls during OKG
      publish cycles.

  doc_corpus:
    module: okg.substrate.library.sources.doc_corpus
    class: DocCorpusSource
    ownership_id: memex-sr.doc-corpus
    source_class: discovery_crawl
    record_identity_kind: scoped_locator
    record_identity_fields: [repo, path]
    source_revision_kind: content_hash
    deletion_semantics: missing_from_completed_scope
    publication_mode: published_generation
    params:
      repo: engram
      repo_root: ${repo_root}
      extractors_dir: ${manifest_dir}
      include_globs:
        - deployments/memex-sr/README.md
        - deployments/memex-sr/HANDOFF.md
        - deployments/memex-sr/PHASE0.md
        - deployments/memex-sr/spec/*.md
        - deployments/memex-sr/docs/*.md
        - deployments/memex-sr/reports/cloudcast-ab/*.md
        - deployments/memex-sr/seed_corpus/*.md
        - docs/okg-context-packet.md
        - docs/okg-memex-sr.md
      exclude_globs:
        - '**/.git/**'
        - '**/.venv/**'
        - '**/node_modules/**'
        - '**/__pycache__/**'
        - external/okg/.venv/**
      max_files: 250
      max_bytes_per_file: 1000000
    sync:
      watch:
        roots:
          - ${repo_root}
        include_globs:
          - deployments/memex-sr/README.md
          - deployments/memex-sr/HANDOFF.md
          - deployments/memex-sr/PHASE0.md
          - deployments/memex-sr/spec/*.md
          - deployments/memex-sr/docs/*.md
          - deployments/memex-sr/reports/cloudcast-ab/*.md
          - deployments/memex-sr/seed_corpus/*.md
          - docs/okg-context-packet.md
          - docs/okg-memex-sr.md
      triggers: [fs_event, poll, manual, reconcile]
      default_event_mode: scope_complete
      reconcile_mode: scope_complete
      deletes_require_reconcile: true
      cheap_probe: stat_tree
      scope:
        accepts: [path]
        unsupported_fallback: scope_complete
      dependents:
        on_event: none
        on_reconcile: none
      poll:
        probe: stat_tree
        interval_seconds: 60

  cloudcast_facts:
    module: sources.cloudcast_facts
    class: CloudcastFactsSource
    ownership_id: memex-sr.cloudcast-facts
    source_class: discovery_crawl
    record_identity_kind: scoped_locator
    record_identity_fields: [facts_path]
    source_revision_kind: content_hash
    deletion_semantics: missing_from_completed_scope
    publication_mode: published_generation
    params:
      facts_path: ${repo_root}/deployments/memex-sr/fixtures/cloudcast_facts.yaml
    sync:
      watch:
        roots:
          - ${repo_root}/deployments/memex-sr/fixtures
        include_globs:
          - deployments/memex-sr/fixtures/cloudcast_facts.yaml
      triggers: [fs_event, poll, manual, reconcile]
      default_event_mode: scope_complete
      reconcile_mode: scope_complete
      deletes_require_reconcile: true
      cheap_probe: stat_tree
      scope:
        accepts: [path]
        unsupported_fallback: scope_complete
      dependents:
        on_event: none
        on_reconcile: none
      poll:
        probe: stat_tree
        interval_seconds: 60

  cloudcast_documents:
    module: sources.cloudcast_documents
    class: CloudcastDocumentsSource
    ownership_id: memex-sr.cloudcast-documents
    source_class: discovery_crawl
    record_identity_kind: scoped_locator
    record_identity_fields: [assets_manifest]
    source_revision_kind: content_hash
    deletion_semantics: missing_from_completed_scope
    publication_mode: published_generation
    params:
      assets_manifest: ${repo_root}/deployments/memex-sr/manifests/cloudcast_acquired_assets.jsonl
      repo_root: ${repo_root}
      source_pack: cloudcast-actionable-v0
      problem_name: cloudcast
      chunk_max_chars: 3200
      chunk_overlap: 250
    sync:
      watch:
        roots:
          - ${repo_root}/deployments/memex-sr/manifests
          - ${repo_root}/deployments/memex-sr/.cache/cloudcast_sources
        include_globs:
          - deployments/memex-sr/manifests/cloudcast_acquired_assets.jsonl
          - deployments/memex-sr/.cache/cloudcast_sources/**
      triggers: [fs_event, poll, manual, reconcile]
      default_event_mode: scope_complete
      reconcile_mode: scope_complete
      deletes_require_reconcile: true
      cheap_probe: stat_tree
      scope:
        accepts: [path]
        unsupported_fallback: scope_complete
      dependents:
        on_event: none
        on_reconcile: none
      poll:
        probe: stat_tree
        interval_seconds: 300

  paper_fulltext_documents:
