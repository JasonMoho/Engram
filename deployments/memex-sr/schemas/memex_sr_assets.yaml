id: https://palimpzest.mit.edu/okg/deployments/memex_sr/assets
name: memex_sr_assets
title: Memex-SR corpus asset overlay
description: >
  Deployment-owned subtypes that are still specific to the Memex-SR
  paper-cut manifest. Core scholarly types such as Paper, Venue, and
  Person come from upstream OKG modules.

prefixes:
  linkml: https://w3id.org/linkml/
  okg: https://palimpzest.mit.edu/okg/
  memex_sr: https://palimpzest.mit.edu/okg/deployments/memex_sr/

default_range: string

imports:
  - linkml:types

classes:
  CorpusPack:
    description: Approved source-pack scope for a corpus slice.
    class_uri: memex_sr:CorpusPack
    attributes:
      pack_id:
        required: true
      name:
      target_years:
      paper_count:
    annotations:
      archetype: concept
      transient: 'false'
      okg_searchable_text_fields: pack_id,name,text

  CorpusCoverageSnapshot:
    description: Coverage state for one corpus pack at a source-run point.
    class_uri: memex_sr:CorpusCoverageSnapshot
    attributes:
      snapshot_id:
        required: true
      pack_id:
      generated_at:
      paper_count:
    annotations:
      archetype: observation
      transient: 'false'
      okg_searchable_text_fields: snapshot_id,pack_id,text

  PublicationSeries:
    description: Persistent publication series such as OSDI or PVLDB.
    class_uri: memex_sr:PublicationSeries
    attributes:
      series_id:
        required: true
      name:
      short_name:
    annotations:
      archetype: concept
      transient: 'false'
      okg_searchable_text_fields: name,short_name,text
      okg_alias_fields: name,short_name

  VenueEdition:
    description: Year-specific venue edition.
    class_uri: memex_sr:VenueEdition
    attributes:
      edition_id:
        required: true
      venue_id:
      year:
      name:
    annotations:
      archetype: concept
      transient: 'false'
      okg_searchable_text_fields: name,venue_id,year,text
      okg_alias_fields: name

  DocumentAsset:
    description: Acquisition manifest asset or URL hint for a paper/document.
    class_uri: memex_sr:DocumentAsset
    attributes:
      asset_id:
        required: true
      asset_kind:
      url:
      access_basis:
      source:
      downloaded:
    annotations:
      archetype: artifact
      transient: 'false'
      okg_searchable_text_fields: asset_kind,url,source,text
